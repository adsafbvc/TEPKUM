name: Clarify schematic product visual

on:
  push:
    paths:
      - '.github/workflows/clarify-schematic.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clarify schematic label
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="visual"><div class="bubble b1">Накопление тепловой энергии</div>'
          new = '<div class="visual"><div class="bubble b1">Схематичное изображение · накопление тепловой энергии</div>'
          if old not in s:
              raise SystemExit('Target label not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Clarify schematic product visual'
          git push
